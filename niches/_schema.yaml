# ============================================================================
# Niche configuration reference.
#
# Copy this file to niches/<slug>.yaml, edit, and validate with:
#   uv run python -m src.main validate-niche niches/<slug>.yaml
#
# Every field below is required; unknown keys are rejected.
# This example is itself a valid config (12 subjects x 2 = 24 pages).
# ============================================================================

# Slug: lowercase letters, digits, underscores only ( ^[a-z0-9_]+$ ).
# Use a _v1 / _v2 suffix for versions.
slug: example_niche_v1

# Niche: short free-text label for the theme.
niche: example

# imprint: OPTIONAL (defaults to "quiet_hours_press"). References
# imprints/<imprint>.yaml — resolves the publisher line for KDP metadata and
# the visual style (palette + font families) of the cover. Set to "pawpress"
# for pet/animal coloring books.
imprint: quiet_hours_press

book:
  # trim_size: "8.5x8.5" or "8.5x11" (v1 supports only these two).
  trim_size: "8.5x8.5"
  # page_count: number of designs; integer 24-100.
  # MUST equal len(subjects) * variations_per_subject.
  page_count: 24
  # price_usd: list price; must be greater than 0.
  price_usd: 9.99
  target_audience: "who this book is for"

style:
  # '>' folds the indented block into a single line.
  art_style: >
    bold and easy coloring book, thick black outlines, no shading, no gray,
    pure black line art on white background, large simple shapes
  line_weight: "very thick"
  negative_prompts: >
    shading, gray tones, hatching, color, fill, photorealistic, 3d, depth,
    fine lines, intricate details, text, letters, numbers, watermarks

# subjects: non-empty list. len(subjects) * variations_per_subject must
# equal book.page_count. Here: 12 * 2 = 24.
# Each subject needs a `kind`: object | character | scene. It steers the image
# prompt — an object is drawn isolated (no invented wrapper character), a
# character as a single centred figure, a scene as a coherent multi-element
# composition.
subjects:
  - name: "example subject 1"
    kind: object
  - name: "example subject 2"
    kind: object
  - name: "example subject 3"
    kind: object
  - name: "example subject 4"
    kind: object
  - name: "example subject 5"
    kind: object
  - name: "example subject 6"
    kind: object
  - name: "example subject 7"
    kind: object
  - name: "example subject 8"
    kind: object
  - name: "example subject 9"
    kind: object
  - name: "example subject 10"
    kind: object
  - name: "example character subject 11"
    kind: character
  - name: "example scene subject 12"
    kind: scene

# variations_per_subject: integer >= 1.
variations_per_subject: 2

# composition_modifiers: non-empty list; cycled across each subject's variations.
composition_modifiers:
  - "centered composition"
  - "with decorative scattered elements around"
  - "with simple geometric border"
  - "diagonal composition"

metadata:
  title_seed: "Working Title: A Coloring Book"
  subtitle_seed: "24 Designs for a Calm Afternoon"
  # author: the KDP author / pen name printed on the cover and interior.
  author: "Quiet Hours Press"
  # keywords_seed: 1-7 entries (KDP provides 7 keyword slots).
  keywords_seed:
    - "primary keyword"
    - "secondary keyword"
  # categories: exactly 2 (KDP rule). Use full KDP browse paths.
  categories:
    - "Books > Category > Subcategory One"
    - "Books > Category > Subcategory Two"
  # low_content: OPTIONAL (defaults to false). KDP's "Low-Content Book"
  # listing toggle. Coloring books have unique designed pages, so leave
  # false. Set true for journals / planners / blank-pages products.
  low_content: false

cover:
  # Colors: 6-digit hex ( ^#[0-9a-fA-F]{6}$ ).
  background_color: "#1a3a52"
  accent_color: "#f4d35e"
  text_color: "#ffffff"
  hero_subject: "the focal illustration for the front cover"
  hero_style: "colorful, simple flat illustration, vector style, no text"
  font_family: "Bebas Neue"

generation:
  model: "fal-ai/flux/schnell"
  image_dimensions: [2550, 2550]   # [width, height] in pixels
  num_inference_steps: 4           # integer >= 1
  guidance_scale: 0.0              # float >= 0
  fixed_seed: null                 # integer for reproducible runs, or null

# post_process: OPTIONAL (defaults to mode: minimal). How the generated page
# is normalised before QA.
#   minimal — upscale + whiten the background only; keeps the model's line art
#   dilate  — binarise + bold every stroke (for pale, thin LoRA output)
#   auto    — binarise + bold, dilation window chosen per image by ink density
post_process:
  mode: minimal

qa:
  min_white_pct: 90.0              # 0-100
  max_gray_pct: 3.0                # 0-100
  required_white_margin_px: 75     # integer >= 0
  required_dimensions: [2550, 2550]
  max_retries_per_slot: 3          # integer >= 0
  # ink_density_band: OPTIONAL [low, high] in percent; defaults to [3.0, 8.0].
  # The healthy ink-coverage range for a well-tuned Bold & Easy subject.
  # ADVISORY ONLY — surfaced by `ink-density` and `validate-niche
  # --ink-preview` for human review; it is never tied to qa_status and never
  # gates QA (Vision QA does the gating). Intricate niches may widen it.
  ink_density_band: [3.0, 8.0]
  # min_subject_area_ratio: OPTIONAL (defaults to 0.40). Composition QA pixel
  # gate — the subject's bounding box of non-white pixels (<240 gray) must
  # cover at least this fraction of the inner canvas (inside the white-margin
  # inset). Pages below this ratio are REJECTED_COMPOSITION and retried. The
  # default is a retry trigger, not a quality bar; raise for niches with
  # consistently large subjects (e.g. dog-breed niches may want 0.50).
  min_subject_area_ratio: 0.40
  # composition_retry_prompt_suffix: OPTIONAL (defaults to ""). Niche hint
  # appended to the image prompt when a slot's previous attempt failed
  # composition QA. Reuses the existing retry mechanism — no separate loop.
  composition_retry_prompt_suffix: "fill at least 70% of the canvas, centered, with bold thick outlines"
