# Nurses — bold & easy coloring book. First production target.
# Validate: uv run python -m src.main validate-niche niches/nurses_v1.yaml

slug: nurses_bold_easy_v1
niche: nurses

book:
  trim_size: "8.5x8.5"
  page_count: 50
  price_usd: 9.99
  target_audience: "nurses, BSN students, nursing graduates"

style:
  art_style: >
    bold and easy line art, thick black outlines, no shading, no gray,
    pure black line art on white background, large simple shapes
  line_weight: "very thick"
  negative_prompts: >
    shading, gray tones, hatching, color, fill, photorealistic, 3d, depth,
    fine lines, intricate details, text, letters, numbers, signatures,
    watermarks, copyright, borders

subjects:
  # Single-subject, cute/iconic, or character-scene phrasing only — no
  # "arrangement"/"stack"/"with surrounding" or multi-item lists, which make
  # schnell render incoherent scattered still-lifes.
  - "a cute stethoscope"
  - "a nurse's cap with a small heart emblem"
  - "a heartbeat line forming a heart shape"
  - "a cute medical bag with a star emblem"
  - "a caring nurse tending to a patient at the bedside"
  - "a cute syringe with a smiling face"
  - "a clipboard with a big checkmark on it"
  - "a single first aid kit with a cross on it"
  - "a cute blood pressure cuff with a heart design"
  - "a nurse standing proudly holding a clipboard"
  - "a medical cross inside a laurel wreath"
  - "a kawaii thermometer with a smiling face"
  - "a smiling pill bottle with a happy face"
  - "a single IV drip bag with a heart on it"
  - "a pair of cute nursing clogs"
  - "a cheerful heart character with a smiling face"
  - "a cute steaming coffee mug with a heart"
  - "a cute lanyard with a round badge"
  - "a cute reflex hammer with a star"
  - "a cute teddy bear with a bandage"
  - "a cute hospital wheelchair"
  - "a nurse superhero with a flowing cape"
  - "a cute adhesive bandage with a smiling face"
  - "a cute heart with a bandage"
  - "a cheerful bouquet of flowers"

variations_per_subject: 2

composition_modifiers:
  # With variations_per_subject: 2, only [0] and [1] are ever used — one per
  # variation. Both must keep the subject a single coherent illustration;
  # "scattered elements" wording is what broke earlier batches.
  - "centered composition"
  - "with a simple decorative border"
  - "on a circular background"
  - "diagonal composition"
  - "with small accent shapes in corners"
  - "with a soft rounded frame"

metadata:
  title_seed: "Nurse Life: A Bold & Easy Coloring Book"
  subtitle_seed: "50 Stress-Relief Designs Celebrating the Nursing Journey"
  author: "Quiet Hours Press"
  keywords_seed:
    - "nurse coloring book"
    - "nursing gifts for women"
    - "RN gifts"
    - "BSN graduation gift"
    - "nurse appreciation"
    - "stress relief coloring book"
    - "nursing student gift"
  categories:
    - "Books > Crafts, Hobbies & Home > Crafts & Hobbies > Drawing"
    - "Books > Health, Fitness & Dieting > Nursing"

cover:
  background_color: "#1a3a52"
  accent_color: "#f4d35e"
  text_color: "#ffffff"
  hero_subject: "a stethoscope arranged in a heart shape with surrounding medical icons"
  hero_style: "colorful, simple flat illustration, vector style, no text"
  font_family: "Bebas Neue"

generation:
  # FLUX schnell caps output at 2048 px; request that directly so the cost
  # estimate is accurate. The post-process upscales to required_dimensions.
  model: "fal-ai/flux/schnell"
  image_dimensions: [2048, 2048]
  num_inference_steps: 4
  guidance_scale: 0.0
  fixed_seed: null

qa:
  # required_dimensions is the post-process target: 2550 px / 8" safe area
  # = 318 DPI, clearing KDP's 300-DPI minimum.
  min_white_pct: 90.0
  max_gray_pct: 3.0
  required_white_margin_px: 75
  required_dimensions: [2550, 2550]
  max_retries_per_slot: 3
