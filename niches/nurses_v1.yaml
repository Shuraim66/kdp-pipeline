# Nurses — bold & easy coloring book. First production target.
# Validate: uv run python -m src.main validate-niche niches/nurses_v1.yaml

slug: nurses_bold_easy_v1
niche: nurses

book:
  trim_size: "8.5x8.5"
  page_count: 50
  price_usd: 9.99
  target_audience: "nurses, BSN students, nursing graduates"

style:
  art_style: >
    bold and easy line art, thick black outlines, pure black line art,
    large simple shapes
  line_weight: "very thick"
  negative_prompts: >
    shading, gray tones, hatching, color, fill, photorealistic, 3d, depth,
    fine lines, intricate details, text, letters, numbers, signatures,
    watermarks, copyright, borders

subjects:
  # Each subject has a `kind` — object / character / scene — that steers the
  # image prompt (src/utils/prompts.py): an object is drawn isolated with no
  # invented wrapper character, a character as a single centred figure, a
  # scene as a coherent multi-element composition.
  - name: "a cute stethoscope"
    kind: object
  - name: "a nurse's cap with a small heart emblem"
    kind: object
  - name: "a heartbeat line forming a heart shape"
    kind: object
  - name: "a cute medical bag with a star emblem"
    kind: object
  - name: "a caring nurse tending to a patient at the bedside"
    kind: scene
  - name: "a cute syringe with a smiling face"
    kind: character
  - name: "a clipboard with a big checkmark on it"
    kind: object
  - name: "a single first aid kit with a cross on it"
    kind: object
  # Q4: replaced "a cute blood pressure cuff with a heart design" — the LoRA
  # rendered it as an ambiguous heart-blob. The first replacement ("medical
  # scrubs hanging on a hook") drew two outfits on hangers, so the wording is
  # now explicitly singular. See CALIBRATION_NOTES.md.
  - name: "a single scrub top hanging on a wall hook"
    kind: object
  - name: "a nurse standing proudly holding a clipboard"
    kind: character
  - name: "a medical cross inside a laurel wreath"
    kind: object
  - name: "a kawaii thermometer with a smiling face"
    kind: character
  - name: "a smiling pill bottle with a happy face"
    kind: character
  - name: "a single IV drip bag with a heart on it"
    kind: object
  - name: "a pair of cute nursing clogs"
    kind: object
  - name: "a cheerful heart character with a smiling face"
    kind: character
  - name: "a cute steaming coffee mug with a heart"
    kind: object
  - name: "a cute lanyard with a round badge"
    kind: object
  - name: "a cute reflex hammer with a star"
    kind: object
  - name: "a cute teddy bear with a bandage"
    kind: character
  - name: "a cute hospital wheelchair"
    kind: object
  - name: "a nurse superhero with a flowing cape"
    kind: character
  - name: "a cute adhesive bandage with a smiling face"
    kind: character
  - name: "a cute heart with a bandage"
    kind: object
  - name: "a cheerful bouquet of flowers"
    kind: object

variations_per_subject: 2

composition_modifiers:
  # With variations_per_subject: 2, only [0] and [1] are ever used — one per
  # variation. Both must keep the subject a single coherent illustration;
  # "scattered elements" wording is what broke earlier batches.
  - "centered composition"
  - "with a simple decorative border"
  - "on a circular background"
  - "diagonal composition"
  - "with small accent shapes in corners"
  - "with a soft rounded frame"

metadata:
  title_seed: "Nurse Life: A Bold & Easy Coloring Book"
  subtitle_seed: "50 Stress-Relief Designs Celebrating the Nursing Journey"
  author: "Quiet Hours Press"
  keywords_seed:
    - "nurse coloring book"
    - "nursing gifts for women"
    - "RN gifts"
    - "BSN graduation gift"
    - "nurse appreciation"
    - "stress relief coloring book"
    - "nursing student gift"
  categories:
    - "Books > Crafts, Hobbies & Home > Crafts & Hobbies > Drawing"
    - "Books > Health, Fitness & Dieting > Nursing"

cover:
  background_color: "#1a3a52"
  accent_color: "#f4d35e"
  text_color: "#ffffff"
  hero_subject: "a stethoscope arranged in a heart shape with surrounding medical icons"
  hero_style: "colorful, simple flat illustration, vector style, no text"
  font_family: "Bebas Neue"

generation:
  # Phase Q2: FLUX dev + coloring-book LoRA via the fal-ai/flux-lora endpoint.
  # Generated at 1000x1000 (1 megapixel); the post-process upscales to 2550.
  model: "fal-ai/flux-lora"
  image_dimensions: [1000, 1000]
  num_inference_steps: 28
  guidance_scale: 3.5
  fixed_seed: null
  loras:
    - path: "https://huggingface.co/renderartist/coloringbookflux/resolve/main/c0l0ringb00k_Flux_v1_renderartist.safetensors"
      scale: 1.0
      name: "coloringbookflux_renderartist"
      trigger: "c0l0ringb00k coloring book page"

post_process:
  # The nurses LoRA tends to draw sparse, pale line art that benefits from
  # bolding; `auto` binarises and picks the dilation window per image from
  # ink density (so a dense page is never over-inked). See CALIBRATION_NOTES.md.
  mode: auto

qa:
  # required_dimensions is the post-process target: 2550 px / 8" safe area
  # = 318 DPI, clearing KDP's 300-DPI minimum.
  # Bold & Easy specific: thick-line art legitimately carries more ink than
  # thin line art, so the white-page floor is loosened from 90 to 85.
  min_white_pct: 85.0
  max_gray_pct: 3.0
  required_white_margin_px: 75
  required_dimensions: [2550, 2550]
  max_retries_per_slot: 3
