generation:
  # FLUX dev + the renderartist coloring-book LoRA via the fal-ai/flux-lora
  # endpoint — same stack proven on cottagecore book 1 (only thing that
  # reliably suppresses the LoRA-less FLUX shading prior on rich scenes).
  # 1000² is the LoRA's tuned resolution; normalize_line_art upscales to 2550
  # in post-process.
  model: "fal-ai/flux-lora"
  image_dimensions: [1000, 1000]
  num_inference_steps: 28
  guidance_scale: 3.5
  fixed_seed: null  # uses per-book seed namespace via book.seed_prefix
  loras:
    - path: "https://huggingface.co/renderartist/coloringbookflux/resolve/main/c0l0ringb00k_Flux_v1_renderartist.safetensors"
      scale: 1.0
      name: "coloringbookflux_renderartist"
      trigger: "c0l0ringb00k coloring book page"

post_process:
  mode: minimal

qa:
  # Relaxed after the first QA run rejected 37/50 slots at the initial strict
  # values — wasting $3+ on retries that produced worse pages. The coloringbook
  # LoRA's natural output distribution sits in 0.40-0.55 sar with 5-12% gray
  # antialiasing and 85-90% white on detailed scenes; cottagecore book 1
  # proved these relaxed values ship clean books. Threshold-tightening for
  # this niche was speculative and counterproductive — see CALIBRATION_NOTES.
  min_white_pct: 85.0
  max_gray_pct: 12.0
  # The coloringbook LoRA fills the canvas with detail (dog tails, scene
  # edges, fence rails). KDP allows ±0.0625" trim variance; 38px = 0.125"
  # at 300dpi gives 2× that buffer — at the floor of safe-but-acceptable.
  required_white_margin_px: 38
  required_dimensions: [2550, 2550]
  max_retries_per_slot: 3
  ink_density_band: [3.0, 8.0]
  min_subject_area_ratio: 0.40
  # Disabled: the prior suffix made retries SMALLER not bigger — the LoRA read
  # "fills 70% of canvas" as "add more background". Empty = plain regeneration.
  composition_retry_prompt_suffix: ""
