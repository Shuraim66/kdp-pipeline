# niches/cozy_dogs_v1.yaml
#
# Reframed from bernese_mountain_dog_v1: dropped breed-specific anchoring
# after the renderartist coloring-book LoRA proved unable to reliably
# produce Berner anatomy (3 iteration cycles, generic cute floppy-eared
# cartoon dog won every time). The LoRA's default IS the product here —
# we stop fighting it, lean into "Cozy Dogs."

slug: cozy_dogs_v1

niche: cozy_dogs

imprint: pawpress

book:
  trim_size: "8.5x8.5"
  page_count: 46
  price_usd: 9.99
  target_audience: "Berner owners, dog lovers, and adults looking for a cozy bold-and-easy coloring book; also suitable for dog-loving teens"

style:
  art_style: >
    bold and easy coloring book, thick black outlines, no shading, no gray,
    pure black line art on white background, large simple shapes,
    kawaii-realistic hybrid, cozy and gift-friendly, cute fluffy dog with
    friendly expression, floppy ears, expressive eyes, soft rounded forms
  line_weight: "very thick"
  negative_prompts: >
    shading, gray tones, hatching, color, fill, photorealistic, 3d, depth,
    fine lines, intricate details, text, letters, numbers, watermarks,
    mandala patterns, zentangle, abstract geometric backgrounds

