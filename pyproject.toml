[project]
name = "kdp-pipeline"
version = "0.1.0"
description = "Production CLI pipeline that generates print-ready Amazon KDP coloring books."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fal-client>=0.5.0",
    "psycopg[binary,pool]>=3.2.0",
    "pillow>=10.4.0",
    "numpy>=2.0",
    "reportlab>=4.2.0",
    "pypdf>=4.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "loguru>=0.7.0",
    "tenacity>=9.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12",
]

# Non-packaged application: `src` is the import root (`python -m src.main`).
# uv builds a venv and installs deps, but does not build/install `src`.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unused_configs = true
pretty = true

[[tool.mypy.overrides]]
# reportlab ships no type information (no py.typed, no stubs).
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: exercises a live external API; needs FAL_KEY / ANTHROPIC_API_KEY",
]
